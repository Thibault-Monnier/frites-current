name: Spotless Check

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  spotless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run spotless check
        run: ./gradlew :TeamCode:spotlessCheck
